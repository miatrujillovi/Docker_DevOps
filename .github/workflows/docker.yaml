name: Buildear Imagen

on: 
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  Revisar:
    name: Lint y Contruccion
    runs-on: ubuntu-latest

    steps:
      - name: Importar Checkout
        uses: actions/checkout@v4

      - name: Lint de la receta
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008, DL4006

  Publicar:
    name: Iniciar sesion en GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Iniciar Sesion
        uses: docker/login-action@v3
        with:
          registry: ghcr.io 
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Importar Checkout
        uses: actions/checkout@v4

      - name: Construir Imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/docker-devops-test:latest