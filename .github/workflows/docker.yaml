name: Buildear Imagen

on: 
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  Revisar:
    name: Lint y Contruccion
    runs-on: ubuntu-latest

    steps:
      - name: Importar Checkout
        uses: actions/checkout@v4

      - name: Lint de la receta
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008, DL4006

  Construir: 
    name: construir
    needs: Revisar
    runs-on: ubuntu-latest

    steps:
      - name: Importar Checkout
        uses: actions/checkout@v4

      - name: Construir Imagen
        run: docker build -t imagen/${{github.sha}} .
