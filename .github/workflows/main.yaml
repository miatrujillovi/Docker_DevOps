name: Buildear Imagen

on: 
  workflow_dispatch:
  
permissions:
  contents: read

jobs:
  Revisar:
    name: Lint y Contruccion
    runs-on: ubuntu-latest

    steps:
      - name: Importar Checkout
        uses: actions/checkout@v4

      - name: Lint de la receta
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008, DL4006

  Construir-Importar:
    name: Construir en Windows y Ubuntu
    needs: Revisar
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            dockerfile: Dockerfile
            artifact: imagen-docker-linux

          - os: windows-latest
            dockerfile: Dockerfile.windows
            artifact: imagen-docker-windows
    
    runs-on: ${{ matrix.os }}

    steps:
    #Construir
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -f ${{ matrix.dockerfile }} -t minecraft-server:latest .

      - name: Exportar imagen 
        run: docker save minecraft-server:latest -o servidor.tar

      - name: Subir imagen 
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: servidor.tar
          compression-level: 0

      #Importar
      - name: Descargar artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}

      #- name: Verificar imagen
      #  run: ls -lh servidor.tar

      - name: Cargar imagen de Docker
        run: docker load -i servidor.tar

      - name: Verificar Importacion
        run: docker inspect minecraft-server:latest