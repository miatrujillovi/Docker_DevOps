name: Buildear Imagen

on: 
  workflow_dispatch: #Activar workflow manualmente
  

permissions:
  contents: read

jobs:
  Revisar:
    name: Lint y Contruccion
    runs-on: ubuntu-latest

    steps:
      - name: Importar Checkout
        uses: actions/checkout@v4

      - name: Lint de la receta
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008, DL4006

  Construir-Linux:
    name: 
    needs: Revisar
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t minecraft-server:latest .

      - name: Exportar imagen 
        run: docker save minecraft-server:latest -o servidor.tar

      - name: Subir imagen 
        uses: actions/upload-artifact@v7
        with:
          name: imagen-docker-linux
          path: servidor.tar
          compression-level: 0

  Importar-Linux:
    name:
    needs: Construir-Linux
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar artifact
        uses: actions/download-artifact@v8
        with:
          name: imagen-docker-linux

      - name: Verificar imagen
        run: ls -lh servidor.tar

      - name: Cargar imagen de Docker
        run: docker load -i servidor.tar

      - name: Verificar Importacion
        run: |
          docker images
          docker inspect minecraft-server:latest

  Construir-Windows:
    name:
    needs: Revisar
    runs-on: Windows

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Construir imagen
        shell: CMD
        run: docker build -t minecraft-server:latest .

      - name: Exportar imagen 
        shell: CMD
        run: docker save minecraft-server:latest -o servidor.tar

      - name: Subir imagen 
        uses: actions/upload-artifact@v7
        with:
          name: imagen-docker-windows
          path: servidor.tar
          compression-level: 0

  Importar-Windows:
    name: 
    needs: Construir-Windows
    runs-on: Windows

    steps:
      - name: Descargar artifact
        uses: actions/download-artifact@v8
        with: 
          name: imagen-docker-windows

      - name: Verificar imagen
        shell: pwsh
        run: Get-Item servidor.tar
        
      - name: Cargar imagen de Docker
        shell: pwsh 
        run: docker load -i servidor.tar

      - name: Verificar Importacion
        shell: pwsh
        run: |
          docker images
          docker inspect minecraft-server:latest